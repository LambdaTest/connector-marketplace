<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Connectors that work with our products: MCP servers, CLIs, plugins and integrations.">
<title>Connector Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: header + search, a two-lane lifecycle track (SDLC above, STLC below) that doubles as the stage filter, then a card grid.
   Each card links to its own page (connectors/<id>/, built by scripts/build-pages.js); the drawer holds "Add your connector". */
:root {
  --bg: #f5f7f8;
  --surface: #ffffff;
  --sunken: #eaeff1;
  --fg: #12202a;
  --muted: #5a6b76;
  --line: #d6dfe3;
  --accent: #0b7a75;
  --accent-soft: #dcf1ef;
  --on-accent: #ffffff;
  --sdlc: #3f5bd9;
  --sdlc-soft: #e4e9fd;
  --stlc: #0b7a75;
  --stlc-soft: #dcf1ef;
  --verified: #0d7a3f;
  --verified-soft: #dcf3e5;
  --official: #6b3fd1;
  --official-soft: #ece4fd;
  --star: #c27c0e;
  --warn: #9a5b00;
  --warn-soft: #fbeed5;
  --down: #b42318;
  --down-soft: #fde4e1;
  --code-bg: #0f1b23;
  --code-fg: #d8e6ee;
  --shadow: 0 1px 2px rgba(18,32,42,.06), 0 8px 24px rgba(18,32,42,.08);
  --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --star: #f2b84b; --warn: #f0b44c; --warn-soft: #3a2a0c; --down: #ff8a7a; --down-soft: #431a16;
    --bg: #0d151b; --surface: #142029; --sunken: #0a1116; --fg: #e3ecf1; --muted: #93a6b2; --line: #24343f;
    --accent: #3cc5bc; --accent-soft: #123a3a; --on-accent: #062221;
    --sdlc: #8ea2ff; --sdlc-soft: #1b2550; --stlc: #3cc5bc; --stlc-soft: #123a3a;
    --verified: #4fd18b; --verified-soft: #123524; --official: #b69cff; --official-soft: #2a1f4d;
    --code-bg: #070d11; --code-fg: #d8e6ee; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --star: #f2b84b; --warn: #f0b44c; --warn-soft: #3a2a0c; --down: #ff8a7a; --down-soft: #431a16;
  --bg: #0d151b; --surface: #142029; --sunken: #0a1116; --fg: #e3ecf1; --muted: #93a6b2; --line: #24343f;
  --accent: #3cc5bc; --accent-soft: #123a3a; --on-accent: #062221;
  --sdlc: #8ea2ff; --sdlc-soft: #1b2550; --stlc: #3cc5bc; --stlc-soft: #123a3a;
  --verified: #4fd18b; --verified-soft: #123524; --official: #b69cff; --official-soft: #2a1f4d;
  --code-bg: #070d11; --code-fg: #d8e6ee; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--f-body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; display: grid; gap: 22px; }
.status-line { display: inline-flex; align-items: center; gap: 8px; margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.status-line .dot { width: 8px; height: 8px; color: var(--muted); }
.status-line.healthy .dot { color: var(--verified); }
.status-line.degraded .dot { color: var(--warn); }
.status-line.down .dot { color: var(--down); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.brand h1 { font: 800 clamp(26px, 4vw, 38px)/1.05 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.brand p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.btn { font: 600 14px/1 var(--f-body); border-radius: 8px; padding: 11px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:focus-visible, .chip:focus-visible, .stop:focus-visible, .card:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; font: 15px var(--f-body); padding: 13px 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.search input::placeholder { color: var(--muted); }
.search kbd { position: absolute; right: 12px; top: 50%; translate: 0 -50%; font: 500 12px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; pointer-events: none; }
.search input:focus + kbd, .search input:not(:placeholder-shown) + kbd { display: none; }
.results-bar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-bottom: -8px; }
.results-bar strong { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Lifecycle track */
.track { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 14px; }
.track-head { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.track-head h2 { font: 700 13px var(--f-display); text-transform: uppercase; letter-spacing: .08em; margin: 0; color: var(--muted); }
.track-head .hint { font-size: 13px; color: var(--muted); margin-right: auto; }
.link-btn { background: none; border: 0; color: var(--accent); font: 600 13px var(--f-body); cursor: pointer; padding: 0; }
/* Stages wrap onto more lines instead of scrolling sideways, so every stage stays visible. */
.lanes { display: grid; gap: 12px; }
.lane { display: grid; grid-template-columns: 56px minmax(0, 1fr); align-items: start; gap: 10px; }
.lane + .lane { border-top: 1px solid var(--line); padding-top: 12px; }
.lane-label { font: 700 12px var(--f-mono); letter-spacing: .06em; padding-top: 7px; }
.lane[data-group="sdlc"] .lane-label { color: var(--sdlc); }
.lane[data-group="stlc"] .lane-label { color: var(--stlc); }
.stops { display: flex; flex-wrap: wrap; gap: 6px; }
.stop { position: relative; z-index: 1; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 10px; font: 500 12.5px/1.2 var(--f-body); display: flex; justify-content: space-between; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
.stop .n { font: 500 11px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.stop.empty { color: var(--muted); border-style: dashed; }
.stop:hover { border-color: var(--accent); }
.lane[data-group="sdlc"] .stop.on { background: var(--sdlc); border-color: var(--sdlc); color: var(--on-accent); }
.lane[data-group="stlc"] .stop.on { background: var(--stlc); border-color: var(--stlc); color: var(--on-accent); }
.stop.on .n { color: inherit; opacity: .85; }

.filters { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.filter-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filter-group > span { font: 600 12px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 999px; padding: 5px 11px; font: 500 13px var(--f-body); cursor: pointer; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; grid-template-rows: auto 1fr auto auto auto; gap: 12px; cursor: pointer; text-align: left; color: inherit; font: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s, transform .15s; }
.card:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
.card-top { display: flex; gap: 12px; align-items: center; }
.logo { width: 44px; height: 44px; border-radius: 10px; flex: none; }
.card-title { min-width: 0; }
.card-title h3 { font: 700 16px/1.2 var(--f-display); margin: 0; }
.card-title .vendor { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.vendor-logo { width: 16px; height: 16px; border-radius: 4px; flex: none; object-fit: contain; background: #fff; }
.works { font-size: 13px; color: var(--muted); }
.works strong { color: var(--accent); font-weight: 600; }
.works strong.plat { color: var(--sdlc); }
/* At most 2 lines, then an ellipsis. The full text is in the title tooltip and the details panel. */
.card p.summary { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; align-self: start; max-height: 3em; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font: 500 11.5px/1 var(--f-mono); padding: 5px 7px; border-radius: 6px; background: var(--sunken); color: var(--muted); }
.tag.sdlc { background: var(--sdlc-soft); color: var(--sdlc); }
.tag.stlc { background: var(--stlc-soft); color: var(--stlc); }
.badge { font: 600 11.5px/1 var(--f-body); padding: 5px 8px; border-radius: 999px; display: inline-flex; gap: 5px; align-items: center; margin-left: auto; }
.badge.community { background: var(--sunken); color: var(--muted); }
.badge.verified { background: var(--verified-soft); color: var(--verified); }
.badge.official { background: var(--official-soft); color: var(--official); }
.badge svg { width: 12px; height: 12px; }
.status { font: 600 11.5px/1 var(--f-body); display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.status .dot { width: 7px; height: 7px; }
.status.healthy { color: var(--verified); }
.status.degraded { color: var(--warn); }
.status.down { color: var(--down); }
.rating { font: 600 12.5px/1 var(--f-body); display: inline-flex; gap: 6px; align-items: center; color: var(--fg); font-variant-numeric: tabular-nums; }
.rating .stars { color: var(--star); letter-spacing: 1px; }
.rating .muted { color: var(--muted); font-weight: 500; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.empty-state { grid-column: 1 / -1; background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 28px; text-align: center; color: var(--muted); }

/* Add-your-connector drawer: two ordered steps, build then list */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.step { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.step-n { font: 600 12px var(--f-mono); color: var(--accent); text-transform: uppercase; letter-spacing: .07em; }
.step h3 { font: 700 17px var(--f-display); margin: 0; }
.step p { margin: 0; color: var(--muted); font-size: 14px; }
.step .btn { justify-self: start; margin-top: 4px; }
.step code { font: 12.5px var(--f-mono); color: var(--fg); }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(5,12,16,.45); z-index: 10; }
.drawer { position: fixed; z-index: 11; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); overflow-y: auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 22px calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 20px; align-content: start; }
/* Grid items default to min-width: auto, so one long install command would widen the whole drawer. */
.drawer > * { min-width: 0; }
.drawer-head { display: flex; gap: 14px; align-items: center; }
.drawer-head > div { min-width: 0; overflow-wrap: anywhere; }
.drawer-head .logo { width: 56px; height: 56px; border-radius: 12px; }
.drawer-head h2 { font: 800 22px/1.15 var(--f-display); margin: 0; }
.drawer-head .vendor { color: var(--muted); font-size: 14px; }
.close { margin-left: auto; align-self: start; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }

@media (max-width: 640px) {
  .lane { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .lane-label { padding-top: 0; }
  .search kbd { display: none; }
  .drawer { top: auto; height: 88%; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Connector Marketplace</h1>
      <p>Connectors that work with our products: MCP servers, CLIs, plugins and integrations, sorted by where they help in the development and testing lifecycle.</p>
      <p class="status-line" id="status-line" role="status"><span class="dot"></span><span>Loading catalog…</span></p>
    </div>
    <button class="btn primary" type="button" data-add>Add your connector</button>
  </header>

  <div class="search">
    <label for="q" class="sr-only">Search connectors</label>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search by name, vendor or what it does" autocomplete="off">
    <kbd id="search-key" aria-hidden="true">⌘K</kbd>
  </div>

  <section class="track" aria-label="Filter by lifecycle stage">
    <div class="track-head">
      <h2>Lifecycle stage</h2>
      <span class="hint">Pick one or more stages to filter</span>
      <button class="link-btn" id="clear-stages" type="button" hidden>Clear stages</button>
    </div>
    <div class="lanes" id="lanes"></div>
  </section>

  <div class="filters">
    <div class="filter-group" id="products"><span>Works with</span></div>
  </div>
  <div class="filters">
    <div class="filter-group" id="types"><span>Type</span></div>
    <div class="filter-group" id="badges"><span>Trust</span></div>
    <div class="filter-group" id="ratings" hidden><span>Rating</span></div>
  </div>

  <div class="results-bar"><span id="count" aria-live="polite"></span><button class="link-btn" type="button" data-reset hidden>Clear all filters</button></div>
  <main class="grid" id="grid"></main>

</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="d-name"></aside>
<!-- Shown in the drawer by the "Add your connector" button, and when the page opens at #list-yours. -->
<template id="add-connector">
  <div class="drawer-head">
    <div><h2 id="d-name">Add your connector</h2><div class="vendor">Built something that works with one of our products? Two steps get it into the marketplace.</div></div>
    <button class="btn close" type="button" id="close" aria-label="Close">Close</button>
  </div>
  <ol class="steps">
    <li class="step">
      <span class="step-n">Step 1</span>
      <h3>Build it</h3>
      <p>Connect your tool to our platform: REST APIs, the MCP server, the test grid or webhooks, and how to sign users in.</p>
      <a class="btn" href="guides/building-a-connector.html">Developer guide</a>
    </li>
    <li class="step">
      <span class="step-n">Step 2</span>
      <h3>List it</h3>
      <p>Add a <code>listings/&lt;id&gt;.yaml</code> file and a logo, and open a pull request. Checks run in about a minute, then our team reviews and merges it.</p>
      <a class="btn" href="guides/contributing.html">Listing guide</a>
    </li>
  </ol>
</template>

<script>
let CATALOG = null;
let HEALTH = null;
let RATINGS = null;
// Filled in by build-site.js; used for the contributing guide and "report a problem" links.
const REPO_URL = /*REPO_URL*/'';
// Ratings are off until RATINGS_ENABLED=true at build time (repo variable in Actions).
const RATINGS_ENABLED = /*RATINGS_ENABLED*/false;
const logoSrc = l => l.logo;

const state = { q: '', stages: new Set(), product: null, type: null, badge: null, minRating: null };
// Minimum average ratings offered as filters.
const RATING_STEPS = [4.5, 4, 3];
const stageInfo = {};
const label = (list, id) => (list.find(x => x.id === id) || { label: id }).label;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SHIELD = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1 2.5 3v4.2c0 3.4 2.3 6.3 5.5 7.3 3.2-1 5.5-3.9 5.5-7.3V3L8 1Zm-1 9.6L4.6 8.2l1-1L7 8.6l3.4-3.4 1 1L7 10.6Z"/></svg>';

const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return `${Math.max(m, 1)} min ago`;
  const h = Math.round(m / 60);
  return h < 48 ? `${h} h ago` : `${Math.round(h / 24)} days ago`;
}
function ratingOf(l) { return RATINGS?.listings?.[l.id] || null; }
const starStr = n => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));
function ratingLine(l) {
  if (!RATINGS_ENABLED) return '';
  const r = ratingOf(l);
  if (!r) return '<span class="rating"><span class="muted">No ratings yet</span></span>';
  return `<span class="rating" aria-label="Rated ${r.average} out of 5 from ${r.count} ratings"><span class="stars" aria-hidden="true">${starStr(r.average)}</span>${r.average.toFixed(1)}<span class="muted">(${r.count})</span></span>`;
}
function healthOf(l) { return HEALTH?.listings?.[l.id] || null; }
function statusPill(l) {
  const h = healthOf(l);
  if (!h) return '<span class="status"><span class="dot"></span>Not checked yet</span>';
  const text = { healthy: 'Healthy', degraded: 'Broken link', down: `Down since ${fmtDate(h.down_since)}` }[h.status];
  return `<span class="status ${h.status}" title="Checked ${esc(ago(h.checked_at))}"><span class="dot"></span>${text}</span>`;
}

function matches(l, skip) {
  if (state.q) {
    const hay = [l.name, l.vendor.name, l.summary, l.id, l.integration.summary, l.integration.platform || '', ...(l.integration.capabilities || []), ...l.products.map(p => label(CATALOG.taxonomy.products, p)), ...l.stages.map(s => stageInfo[s]?.label)].join(' ').toLowerCase();
    if (!state.q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  if (skip !== 'stages' && state.stages.size && !l.stages.some(s => state.stages.has(s))) return false;
  if (skip !== 'product' && state.product && !l.products.includes(state.product)) return false;
  if (skip !== 'type' && state.type && l.type !== state.type) return false;
  if (skip !== 'badge' && state.badge && l.badge !== state.badge) return false;
  if (skip !== 'rating' && state.minRating && !((ratingOf(l)?.average || 0) >= state.minRating)) return false;
  return true;
}

function renderLanes() {
  const pool = CATALOG.listings.filter(l => matches(l, 'stages'));
  document.getElementById('lanes').innerHTML = CATALOG.taxonomy.stage_groups.map(g => `
    <div class="lane" data-group="${g.id}">
      <div class="lane-label" title="${esc(g.label)}">${g.id.toUpperCase()}</div>
      <div class="stops">${g.values.map(v => {
        const n = pool.filter(l => l.stages.includes(v.id)).length;
        return `<button type="button" class="stop ${state.stages.has(v.id) ? 'on' : ''} ${n ? '' : 'empty'}" data-stage="${v.id}" aria-pressed="${state.stages.has(v.id)}">${esc(v.label)}<span class="n">${n}</span></button>`;
      }).join('')}</div>
    </div>`).join('');
  document.getElementById('clear-stages').hidden = !state.stages.size;
}

function renderChips(id, list, key, field) {
  const el = document.getElementById(id);
  const pool = CATALOG.listings.filter(l => matches(l, key));
  const has = (l, id) => [].concat(l[field]).includes(id);
  const items = list.filter(x => CATALOG.listings.some(l => has(l, x.id)));
  el.innerHTML = el.firstElementChild.outerHTML + items.map(x => {
    const n = pool.filter(l => has(l, x.id)).length;
    return `<button type="button" class="chip ${state[key] === x.id ? 'on' : ''}" data-${key}="${x.id}" aria-pressed="${state[key] === x.id}">${esc(x.label)} · ${n}</button>`;
  }).join('');
}

function card(l) {
  const stages = l.stages.slice(0, 3).map(s => `<span class="tag ${stageInfo[s].group}">${esc(stageInfo[s].label)}</span>`).join('');
  const more = l.stages.length > 3 ? `<span class="tag">+${l.stages.length - 3}</span>` : '';
  return `<a class="card" href="connectors/${encodeURIComponent(l.id)}/">
    <div class="card-top">
      <img class="logo" src="${esc(logoSrc(l))}" alt="">
      <div class="card-title"><h3>${esc(l.name)}</h3><div class="vendor">${l.vendor.logo ? `<img class="vendor-logo" src="${esc(l.vendor.logo)}" alt="">` : ''}<span>${esc(l.vendor.name)}</span></div></div>
      <span class="badge ${l.badge}">${CATALOG.taxonomy.badges.find(b => b.id === l.badge)?.verified_registry ? SHIELD : ''}${esc(label(CATALOG.taxonomy.badges, l.badge))}</span>
    </div>
    <p class="summary" title="${esc(l.summary || '')}">${esc(l.summary || '')}</p>
    <div class="works">${l.integration.platform ? `<strong class="plat">${esc(l.integration.platform)}</strong> ⇄ ` : 'Works with '}${l.products.map(p => `<strong>${esc(label(CATALOG.taxonomy.products, p))}</strong>`).join(', ')}</div>
    <div class="meta"><span class="tag">${esc(label(CATALOG.taxonomy.types, l.type))}</span>${stages}${more}</div>
    <div class="card-foot">${ratingLine(l)}${statusPill(l)}</div>
  </a>`;
}

function renderRatingChips() {
  const el = document.getElementById('ratings');
  const rated = CATALOG.listings.filter(l => ratingOf(l));
  // Hide the filter until at least one connector has a rating.
  el.hidden = rated.length === 0;
  if (el.hidden) return;
  const pool = CATALOG.listings.filter(l => matches(l, 'rating'));
  el.innerHTML = el.firstElementChild.outerHTML + RATING_STEPS.map(min => {
    const n = pool.filter(l => (ratingOf(l)?.average || 0) >= min).length;
    const on = state.minRating === min;
    return `<button type="button" class="chip ${on ? 'on' : ''}" data-rating="${min}" aria-pressed="${on}" aria-label="Rated ${min} stars or more">${min}★ &amp; up · ${n}</button>`;
  }).join('');
}

function render() {
  const shown = CATALOG.listings.filter(l => matches(l));
  const order = { official: 0, verified: 1, community: 2 };
  shown.sort((a, b) => (order[a.badge] ?? 9) - (order[b.badge] ?? 9) || a.name.localeCompare(b.name));
  document.getElementById('grid').innerHTML = shown.length ? shown.map(card).join('')
    : `<div class="empty-state">No connectors match these filters yet. <button class="link-btn" type="button" data-reset>Clear all filters</button> or ${REPO_URL ? `<a href="${esc(REPO_URL)}/issues/new?template=request-connector.yml" target="_blank" rel="noopener" style="color:var(--accent)">request one</a>` : '<button class="link-btn" type="button" data-add>add yours</button>'}.</div>`;
  const filtered = state.q || state.stages.size || state.product || state.type || state.badge || state.minRating;
  document.getElementById('count').innerHTML = filtered
    ? `<strong>${shown.length}</strong> of ${CATALOG.count} connectors`
    : `<strong>${CATALOG.count}</strong> connectors`;
  document.querySelector('.results-bar [data-reset]').hidden = !filtered;
  renderLanes();
  renderChips('products', CATALOG.taxonomy.products, 'product', 'products');
  renderChips('types', CATALOG.taxonomy.types, 'type', 'type');
  renderChips('badges', CATALOG.taxonomy.badges, 'badge', 'badge');
  renderRatingChips();
}

let lastFocus = null;
const ADD_HASH = 'list-yours';
function openAddDrawer() {
  const d = document.getElementById('drawer');
  d.replaceChildren(document.getElementById('add-connector').content.cloneNode(true));
  showDrawer(ADD_HASH);
}
function showDrawer(hash) {
  document.getElementById('close').onclick = closeDrawer;
  lastFocus = document.activeElement;
  history.replaceState(null, '', '#' + hash);
  document.getElementById('drawer').hidden = false; document.getElementById('scrim').hidden = false;
  document.getElementById('close').focus({ preventScroll: true });
}
function closeDrawer() {
  history.replaceState(null, '', location.pathname + location.search);
  document.getElementById('drawer').hidden = true; document.getElementById('scrim').hidden = true;
  lastFocus?.focus();
}

document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-stage],[data-product],[data-type],[data-badge],[data-rating],[data-add],[data-reset],#clear-stages');
  if (!t) return;
  if (t.dataset.stage) { state.stages.has(t.dataset.stage) ? state.stages.delete(t.dataset.stage) : state.stages.add(t.dataset.stage); render(); }
  else if (t.dataset.product) { state.product = state.product === t.dataset.product ? null : t.dataset.product; render(); }
  else if (t.dataset.type) { state.type = state.type === t.dataset.type ? null : t.dataset.type; render(); }
  else if (t.dataset.badge) { state.badge = state.badge === t.dataset.badge ? null : t.dataset.badge; render(); }
  else if (t.dataset.rating) { const v = Number(t.dataset.rating); state.minRating = state.minRating === v ? null : v; render(); }
  else if ('add' in t.dataset) openAddDrawer();
  else if (t.id === 'clear-stages') { state.stages.clear(); render(); }
  else if ('reset' in t.dataset) { Object.assign(state, { q: '', product: null, type: null, badge: null, minRating: null }); state.stages.clear(); document.getElementById('q').value = ''; render(); }
});
document.getElementById('scrim').onclick = closeDrawer;
// userAgentData reports "macOS", navigator.platform "MacIntel": match either.
const IS_MAC = /mac|iphone|ipad/i.test(navigator.userAgentData?.platform || navigator.platform);
if (!IS_MAC) document.getElementById('search-key').textContent = 'Ctrl K';
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('drawer').hidden) closeDrawer();
  // ⌘K (Ctrl+K off macOS) jumps to search from anywhere on the page.
  else if (e.key.toLowerCase() === 'k' && (IS_MAC ? e.metaKey : e.ctrlKey) && !e.altKey && !e.shiftKey) {
    e.preventDefault();
    if (!document.getElementById('drawer').hidden) closeDrawer();
    const q = document.getElementById('q');
    q.focus(); q.select();
  }
});
async function boot() {
  try {
    const [cat, health, ratings] = await Promise.all([
      fetch('catalog.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch('health.json', { cache: 'no-cache' }).then(r => (r.ok ? r.json() : null)).catch(() => null),
      RATINGS_ENABLED ? fetch('ratings.json', { cache: 'no-cache' }).then(r => (r.ok ? r.json() : null)).catch(() => null) : null,
    ]);
    CATALOG = cat; HEALTH = health; RATINGS = ratings;
  } catch (err) {
    document.getElementById('status-line').lastElementChild.textContent = 'Could not load the catalog. Refresh to try again.';
    return;
  }
  CATALOG.taxonomy.stage_groups.forEach(g => g.values.forEach(v => stageInfo[v.id] = { ...v, group: g.id }));
  // Count only listings on the page: ones failing for 7+ days are left out of catalog.json.
  const shownHealth = HEALTH ? CATALOG.listings.map(l => HEALTH.listings[l.id]).filter(Boolean) : [];
  const hc = HEALTH && Object.fromEntries(['healthy', 'degraded', 'down'].map(s => [s, shownHealth.filter(h => h.status === s).length]));
  // One health summary; the connector count lives in the results bar above the grid.
  const line = document.getElementById('status-line');
  if (hc) {
    const worst = hc.down ? 'down' : hc.degraded ? 'degraded' : 'healthy';
    const parts = hc.degraded || hc.down
      ? [`${hc.healthy} healthy`, hc.degraded && `${hc.degraded} with a broken link`, hc.down && `${hc.down} down`].filter(Boolean).join(', ')
      : `All ${hc.healthy} connectors healthy`;
    line.className = `status-line ${worst}`;
    line.lastElementChild.textContent = `${parts} · checked ${ago(HEALTH.checked_at)}`;
  } else {
    line.lastElementChild.textContent = 'Health checks run every 6 hours';
  }
  const params = new URLSearchParams(location.search);
  for (const key of ['product', 'type', 'badge']) if (params.get(key)) state[key] = params.get(key);
  params.getAll('stage').forEach(s => state.stages.add(s));
  render();
  openFromHash();
  // Same-page links and edits to the URL's #part don't reload the page.
  addEventListener('hashchange', openFromHash);
}
function openFromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id === ADD_HASH) openAddDrawer();
  // Old links opened a connector in the drawer (#<id>); it has its own page now.
  else if (id && CATALOG.listings.some(l => l.id === id)) location.replace(`connectors/${encodeURIComponent(id)}/`);
}
boot();
</script>
</body>
