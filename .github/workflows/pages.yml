name: Site

# Builds the marketplace site and deploys it to GitHub Pages:
# - on every merge to main (new or changed listings go live),
# - every 6 hours (fresh health status), after each new review (reviews.yml, only with ratings on), and on demand.
# Ratings are off unless the repo variable RATINGS_ENABLED is 'true'.
# Health history (down since, last OK) is read back from the live site's health.json,
# so nothing is committed to the repo. Runs on main only: no fork code.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site
        env:
          RATINGS_ENABLED: ${{ vars.RATINGS_ENABLED }}
        run: npm run build:site

      - name: Check health
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/check-health.js --out dist/site/health.json --previous "$SITE_URL/health.json" --catalog dist/site/catalog.json

      - name: Collect ratings
        if: vars.RATINGS_ENABLED == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-ratings.js --out dist/site/ratings.json

      - name: Open or close health issues
        # A listing that has been down for 4 runs in a row (about a day) gets an issue,
        # and the issue closes itself when the listing is healthy again.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const health = require('./dist/site/health.json');
            const { owner, repo } = context.repo;
            const LABEL = 'listing-health';
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: LABEL, per_page: 100 });
            for (const l of Object.values(health.listings)) {
              const title = `[Health] ${l.id} is ${l.status === 'down' ? 'down' : 'failing checks'}`;
              const hideNote = l.hide_on ? `If checks still fail on ${l.hide_on.slice(0, 10)}, the listing is hidden from the marketplace until they pass again.` : '';
              const issue = open.find((i) => i.title.startsWith(`[Health] ${l.id} `));
              if (l.status !== 'healthy' && l.failing_runs >= 4 && !issue) {
                const problems = l.problems.map((p) => `- ${p.message}: ${p.url}`).join('\n');
                await github.rest.issues.create({
                  owner, repo, title, labels: [LABEL],
                  body: `\`${l.id}\` has failed health checks since ${l.down_since} (${l.failing_runs} runs in a row).\n\n${problems}\n\nPartner: please fix the endpoint or links, or update the listing. ${hideNote} This issue closes itself when checks pass.`,
                });
              } else if (l.hidden && issue && !issue.labels.some((x) => x.name === 'listing-hidden')) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Still failing after ${l.failing_runs} runs, so \`${l.id}\` is now hidden from the marketplace. It comes back automatically once checks pass.` });
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['listing-hidden'] });
              } else if (l.status === 'healthy' && issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Healthy again as of ${l.checked_at}. Closing.` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
            }

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
