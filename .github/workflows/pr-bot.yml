name: PR bot

# Posts the report built by "Listing checks" as a single PR comment, updated on every push.
#
# Why a separate workflow: fork PRs run with a read-only token, so they can't comment.
# `workflow_run` runs here, in the base repo, with the permissions below. It never checks
# out or runs PR code. The downloaded report is treated as untrusted text: it's only
# posted as a comment, and the PR number comes from the GitHub API, not from the artifact.
on:
  workflow_run:
    workflows: ["Listing checks"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-report
          path: pr-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- connector-marketplace-bot -->';
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            if (!fs.existsSync('pr-report/report.md')) {
              core.info('No report artifact for this run.');
              return;
            }

            // Find the PR by head commit. workflow_run.pull_requests is empty for forks.
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const pr = prs.find((p) => p.head.sha === run.head_sha);
            if (!pr) {
              core.info(`No open PR with head ${run.head_sha}.`);
              return;
            }

            let report = fs.readFileSync('pr-report/report.md', 'utf8').slice(0, 60000);
            if (!report.startsWith(MARKER)) report = `${MARKER}\n${report}`;
            const ready = report.includes('✅ Ready for maintainer review') && run.conclusion === 'success';
            const body = `${report}\n\n<sub>CI: [${run.conclusion}](${run.html_url}) · commit ${run.head_sha.slice(0, 7)}</sub>`;

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }

            // Labels let maintainers filter the review queue.
            const add = ready ? 'ready-for-review' : 'needs-changes';
            const remove = ready ? 'needs-changes' : 'ready-for-review';
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [add] });
            await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: remove }).catch(() => {});
