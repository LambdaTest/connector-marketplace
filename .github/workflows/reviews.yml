name: Reviews

# Triage for "Rate a connector" issues: check the review, reply, close the issue,
# and redeploy the site so the rating shows within a few minutes.
#
# The issue body is untrusted input. It is only parsed as text by scripts/lib/reviews.js
# from main; nothing from the issue is run or put into a shell command.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Ratings are off unless the repo variable RATINGS_ENABLED is 'true'.
    if: vars.RATINGS_ENABLED == 'true' && contains(github.event.issue.labels.*.name, 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check review and reply
        uses: actions/github-script@v7
        with:
          script: |
            const { parseReview } = require('./scripts/lib/reviews');
            const { validateFiles, listingFiles } = require('./scripts/lib/validate');
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const listings = validateFiles(listingFiles()).listings;
            const MARK = '<!-- review-bot -->';

            const r = parseReview(issue.body);
            const listing = !r.error && listings.find((l) => l.id === r.listing);
            let message;
            let valid = false;
            if (r.error) {
              message = `Thanks for the review! It can't be counted yet: ${r.error} Edit this issue to fix it.`;
            } else if (!listing) {
              message = `Thanks for the review! There's no connector with the id \`${r.listing}\`. Edit this issue and use the id from the connector's page.`;
            } else {
              valid = true;
              message = `Thanks, @${issue.user.login}! Your ${'★'.repeat(r.rating)} rating for **${listing.name}** will show on the marketplace in a few minutes. Edit this issue anytime to change it.`;
            }

            // One bot reply per issue, updated on edits.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number, per_page: 100 });
            const mine = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(MARK));
            const body = `${MARK}\n${message}`;
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });

            if (valid) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'review-invalid' }).catch(() => {});
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              // Rebuild the site so the new rating appears. Many reviews in a row queue up
              // behind one another (pages.yml doesn't cancel in-progress runs).
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'pages.yml', ref: context.payload.repository.default_branch });
            } else {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['review-invalid'] });
            }
